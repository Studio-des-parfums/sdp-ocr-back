name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint avec Ruff
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ──────────────────────────────────────────────
  # 2. Tests (pytest) — Prioritaire : vérifie l'API et la résilience aux erreurs
  # ──────────────────────────────────────────────
  test:
    name: 🧪 API & Resilience Tests (pytest)
    runs-on: ubuntu-latest

    # Variables d'environnement factices pour que l'app démarre sans vraie DB / API
    env:
      MISTRAL_API_KEY: "ci-dummy-key"
      OPENAI_API_KEY: "ci-dummy-key"
      RESEND_API_KEY: "ci-dummy-key"
      RESEND_FROM_EMAIL: "no-reply@example.com"
      DATABASE_URL: "sqlite:///:memory:"
      DB_HOST: "localhost"
      DB_PORT: "3306"
      DB_USER: "ci"
      DB_PASSWORD: "ci"
      DB_NAME: "ci_db"
      STORAGE_BACKEND: "local"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies (WeasyPrint / PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-xlib-2.0-0 libffi-dev shared-mime-info \
            fonts-liberation poppler-utils

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/test_api.py \
            -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────
  # 3. Audit de sécurité des dépendances
  # ──────────────────────────────────────────────
  security:
    name: 🔒 Security audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

